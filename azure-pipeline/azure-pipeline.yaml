# Disparador para Integración Continua
trigger:
  branches:
    include:
      - main
      - test
      - ci/*
      - feature/*
      - fix/*
      - bugfix/*
      - hotfix/*

# Enrutamiento al servidor Ubuntu
pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  - group: acr-credentials
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '8.x'
  - name: imageName
    value: 'dockermg-g9hrgcc4etdrh8eg.azurecr.io/api-middleware-sap'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: envTag
      value: 'prod-latest'
    - name: uniqueTag
      value: 'prod-$(Build.BuildId)'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
    - name: envTag
      value: 'test-latest'
    - name: uniqueTag
      value: 'test-$(Build.BuildId)'
  - ${{ else }}:
    - name: envTag
      value: 'none'
    - name: uniqueTag
      value: 'none'

stages:
# =====================================================================
# ETAPA 1: VALIDACIÓN DE CÓDIGO Y PRUEBAS (CI Puro para .NET 8)
# =====================================================================
- stage: CI_Code_Quality
  displayName: 'Integración Continua - Calidad y Pruebas'
  jobs:
  - job: Validar_Y_Probar
    displayName: 'Compilación y Pruebas'
    steps:
    
    # 1. Configurar SDK de .NET 8
    - task: UseDotNet@2
      displayName: 'Setup .NET $(dotnetVersion) SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    # 2. Restaurar dependencias
    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # 3. Compilar la solución (Clean Architecture)
    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # 4. Pruebas Unitarias
    #- task: DotNetCoreCLI@2
    #  displayName: 'Run Unit Tests'
    #  inputs:
    #    command: 'test'
    #    projects: 'tests/Middleware.UnitTests/Middleware.UnitTests.csproj'
    #    arguments: '--configuration $(buildConfiguration) --no-build'
    #    publishTestResults: true

    # 5. Pruebas de Integración (Excluyendo la inestable)
    #- task: DotNetCoreCLI@2
    #  displayName: 'Run Integration Tests'
    #  inputs:
    #    command: 'test'
    #    projects: 'tests/Middleware.IntegrationTests/Middleware.IntegrationTests.csproj'
    #    arguments: '--configuration $(buildConfiguration) --no-build --filter "FullyQualifiedName!=Middleware.IntegrationTests.Concurrency.SapThrottleTests.Throttle_DoesNotDropRequests_UnderHighConcurrency"'
    #    publishTestResults: true

# =====================================================================
# ETAPA 2: CONSTRUCCIÓN Y PUBLICACIÓN EN AZURE CONTAINER REGISTRY
# =====================================================================
- stage: Build_Docker
  displayName: 'Construcción de Imagen Docker'
  dependsOn: CI_Code_Quality
  condition: and(succeeded(), ne(variables.envTag, 'none'))
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push Docker Azure'
    steps:

    # 1. Configurar el SDK de .NET 8 en este Job (Resuelve global.json y SDK not found)
    - task: UseDotNet@2
      displayName: 'Setup .NET $(dotnetVersion) SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    # 2. Publicación de binarios en el host
    - task: DotNetCoreCLI@2
      displayName: 'Publicar binarios de .NET 8 en el host'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Middleware.Api/Middleware.Api.csproj'
        arguments: '--configuration $(buildConfiguration) -o $(Build.SourcesDirectory)/publish --no-restore'
        zipAfterPublish: false
        modifyOutputPath: false

    # 3. Empaquetado ligero y subida a ACR
    - bash: |
        set -euo pipefail
        
        echo "=== 1. Autenticando en Azure Container Registry ==="
        printf '%s' "$ACR_PASSWORD" | docker login dockermg-g9hrgcc4etdrh8eg.azurecr.io -u "$ACR_USERNAME" --password-stdin

        echo "=== 2. Construyendo imagen Docker liviana ($ENV_TAG) ==="
        docker build -f $DOCKERFILE_PATH \
          -t $IMAGE_NAME:$UNIQUE_TAG \
          -t $IMAGE_NAME:$ENV_TAG \
          $(Build.SourcesDirectory)
          
        echo "=== 3. Subiendo imágenes a ACR ==="
        docker push $IMAGE_NAME:$UNIQUE_TAG
        docker push $IMAGE_NAME:$ENV_TAG
      displayName: 'Empaquetar y Almacenar Contenedor en Azure'
      env:
        ACR_USERNAME: $(acrUsername)
        ACR_PASSWORD: $(acrPassword)
        ENV_TAG: $(envTag)
        UNIQUE_TAG: $(uniqueTag)
        IMAGE_NAME: $(imageName)
        DOCKERFILE_PATH: $(dockerfilePath)

    # 4. Generación de metadata inmutable para el CD
    - bash: |
        set -euo pipefail
        mkdir -p $(Build.ArtifactStagingDirectory)/deploy-info
        echo "$(uniqueTag)" > $(Build.ArtifactStagingDirectory)/deploy-info/image-tag.txt
        echo "Tag publicado para CD: $(uniqueTag)"
      displayName: 'Generar metadata de despliegue'

    # 5. Publicación del artefacto deploy-info
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/deploy-info'
        ArtifactName: 'deploy-info'
      displayName: 'Publicar artefacto deploy-info'

    # 6. Cierre de sesión seguro en ACR
    - bash: |
        docker logout dockermg-g9hrgcc4etdrh8eg.azurecr.io || true
      displayName: 'Cerrar sesión de ACR'
      condition: always()